services:
  chatlas:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      APP_ORIGIN: ${APP_ORIGIN:?Set the public HTTPS APP_ORIGIN}
      SESSION_SECRET: ${SESSION_SECRET:?Run npm run secrets:init}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:?Run npm run secrets:init}
      TWITCH_CLIENT_ID: ${TWITCH_CLIENT_ID:-}
      TWITCH_CLIENT_SECRET: ${TWITCH_CLIENT_SECRET:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-Xenova/all-MiniLM-L6-v2}
    volumes:
      - chatlas-data:/data
    stop_grace_period: 20s
volumes:
  chatlas-data:
